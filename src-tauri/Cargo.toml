[package]
name = "lownotes"
version = "0.3.3"
description = "Local-first Markdown notes with serverless P2P sync and real-time collaboration"
authors = ["LowBloat"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lownotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
iroh = "1.2"
iroh-tickets = "1"
parking_lot = "0.12"
yrs = { version = "0.28", features = ["sync"] }
directories = "6"
walkdir = "2"
blake3 = "1"
base64 = "0.22"
rand = "0.9"
hostname = "0.4"
filetime = "0.2"
reqwest = { version = "0.13", features = ["json", "multipart"] }
html-escape = "0.2"
semver = "1"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
gif = "0.14"
percent-encoding = "2.3"
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
