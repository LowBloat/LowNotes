name: Bug report
description: Report a reproducible problem in LowNotes.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please write in English and check existing issues first. Use sample notes and remove private content, API keys and pairing codes from attachments.
  - type: input
    id: version
    attributes:
      label: LowNotes version
      placeholder: "Example: 0.3.4"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and installation format
      placeholder: "Example: Windows 11 x64, setup .exe"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small Markdown sample if relevant. For sync problems, include both app versions and the connection state of each device.
      placeholder: |
        1. Open a sample vault
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots, logs or additional context
      description: Optional. Remove sensitive data before attaching files.
