name: Bundle smoke test

# Packaging problems (icons, beforeBuildCommand, embedded frontend) used to
# surface only when a release tag was pushed. Build the app on changes that
# can affect packaging.
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "scripts/**"
      - "svelte.config.js"
      - "vite.config.js"
      - ".github/workflows/bundle.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "scripts/**"
      - ".github/workflows/bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Debug bundle (deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: bundle
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: bun install --frozen-lockfile
      # Debug keeps the build fast; bundling still runs the icon generation,
      # the frontend build and Tauri's asset embedding with the CSP.
      # Updater artifacts need the release signing key, which pull requests do
      # not get; everything else about bundling is exercised.
      - name: Build the app
        run: bun run tauri build --debug --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check the package exists
        run: ls -la src-tauri/target/debug/bundle/deb/*.deb
      # MCP clients launch the bridge from next to the app (#102).
      - name: Check the package ships the MCP bridge
        run: |
          binaries=$(dpkg-deb -c src-tauri/target/debug/bundle/deb/*.deb | grep 'usr/bin/')
          echo "$binaries"
          grep -q 'usr/bin/lownotes-mcp$' <<< "$binaries"
