name: Verify changes

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/screenshots/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/screenshots/**"
  workflow_dispatch:
  # The release workflow reuses these checks before building installers.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend and interface
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run version:check
      - run: bun run check
      - run: bun run check:e2e
      - run: bun test
      - run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - run: bun run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install browser for interface regressions
        run: bunx playwright install --with-deps chromium
      - name: Interface regression tests
        run: bun run test:e2e
      - name: Upload interface diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interface-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Rust format and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: lint
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      - name: rustfmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib --tests -- -D warnings

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev gnome-keyring
      - name: Rust regression tests
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
      # Windows is where filesystem races showed up (#50); a second run surfaces
      # intermittent failures early. The build is cached, so it costs about a minute.
      - name: Rust regression tests (second run)
        if: runner.os == 'Windows'
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
      - name: Native credential store regression (Windows/macOS)
        if: runner.os != 'Linux'
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml credentials::tests::native_store_round_trip -- --exact --ignored
      - name: Native credential store regression (Linux isolated session)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c 'printf "lownotes-ci\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; cargo test --locked --lib --manifest-path src-tauri/Cargo.toml credentials::tests::native_store_round_trip -- --exact --ignored'
