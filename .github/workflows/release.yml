name: Release multiplataforma

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para compilar (ex: v0.1.1)"
        required: true
        type: string
      source_ref:
        description: "Ref do código para compilar (opcional; usa a tag por padrão)"
        required: false
        type: string
      dry_run:
        description: "Só compilar os instaladores, sem publicar a Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Conferir versão
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Conferir versões do aplicativo
        id: version
        run: bun scripts/check-version.mjs "$RELEASE_TAG"

  # Same checks as every pull request (frontend, interface and Rust on the
  # three systems), run against the tagged code. The installers build in
  # parallel; nothing is published unless the checks pass.
  checks:
    name: Verificações
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows x64
    needs: [verify]
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile

      - name: Compilar aplicativo com Tauri
        run: bun run tauri build

      - name: Empacotar binários e instaladores
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          
          # Coletar instalador NSIS
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $destName = "LowNotes-$env:VERSION-windows-x64-setup.exe"
            Copy-Item $nsis.FullName "dist/$destName"
            $hash = (Get-FileHash "dist/$destName" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $destName" | Set-Content "dist/$destName.sha256" -Encoding ascii -NoNewline
          }

          # Coletar assinatura do updater (NSIS)
          $sig = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "dist/LowNotes-$env:VERSION-windows-x64-setup.exe.sig"
          }

          # Coletar instalador MSI
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $destMsi = "LowNotes-$env:VERSION-windows-x64.msi"
            Copy-Item $msi.FullName "dist/$destMsi"
            $hashMsi = (Get-FileHash "dist/$destMsi" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hashMsi  $destMsi" | Set-Content "dist/$destMsi.sha256" -Encoding ascii -NoNewline
          }

          # Criar pacote portátil (.zip) com o executável puro
          $rawExe = "src-tauri/target/release/lownotes.exe"
          if (Test-Path $rawExe) {
            $portableDir = "dist/LowNotes-$env:VERSION-windows-x64-portable"
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $rawExe "$portableDir/LowNotes.exe"
            Copy-Item "README.md" $portableDir
            Copy-Item "LICENSE" $portableDir
            $portableZip = "dist/LowNotes-$env:VERSION-windows-x64-portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            $zipHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
            "$zipHash  LowNotes-$env:VERSION-windows-x64-portable.zip" | Set-Content "$portableZip.sha256" -Encoding ascii -NoNewline
          }

      - name: Guardar artefatos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lownotes-windows
          path: dist/*.*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [verify]
    # The repository variable LINUX_RELEASE_RUNNER, a JSON list of labels such
    # as ["self-hosted","lownotes-linux-release"], moves this build to the
    # self-hosted runner described in .github/runner. Unset, it runs on GitHub.
    runs-on: ${{ vars.LINUX_RELEASE_RUNNER && fromJSON(vars.LINUX_RELEASE_RUNNER) || 'ubuntu-22.04' }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Instalar bibliotecas de sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile

      - name: Compilar aplicativo com Tauri
        run: bun run tauri build

      - name: Empacotar binários e pacotes Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # Coletar .deb
          deb_file=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1 || true)
          if [[ -n "$deb_file" && -f "$deb_file" ]]; then
            dest_deb="LowNotes-${VERSION}-linux-x64.deb"
            cp "$deb_file" "dist/$dest_deb"
            (cd dist && sha256sum "$dest_deb" > "$dest_deb.sha256")
          fi

          # Coletar .rpm
          rpm_file=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" | head -n 1 || true)
          if [[ -n "$rpm_file" && -f "$rpm_file" ]]; then
            dest_rpm="LowNotes-${VERSION}-linux-x64.rpm"
            cp "$rpm_file" "dist/$dest_rpm"
            (cd dist && sha256sum "$dest_rpm" > "$dest_rpm.sha256")
          fi

          # Coletar .AppImage
          appimage=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1 || true)
          if [[ -n "$appimage" && -f "$appimage" ]]; then
            dest_app="LowNotes-${VERSION}-linux-x64.AppImage"
            cp "$appimage" "dist/$dest_app"
            (cd dist && sha256sum "$dest_app" > "$dest_app.sha256")
          fi

          # Coletar assinatura do updater (AppImage)
          sig=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage.sig" | head -n 1 || true)
          if [[ -n "$sig" && -f "$sig" ]]; then
            cp "$sig" "dist/LowNotes-${VERSION}-linux-x64.AppImage.sig"
          fi

          # Criar pacote portátil tar.gz com o executável
          if [[ -f "src-tauri/target/release/lownotes" ]]; then
            portable_dir="dist/LowNotes-${VERSION}-linux-x64-portable"
            mkdir -p "$portable_dir"
            cp "src-tauri/target/release/lownotes" "$portable_dir/LowNotes"
            chmod +x "$portable_dir/LowNotes"
            cp README.md LICENSE "$portable_dir/"
            tar -czf "dist/LowNotes-${VERSION}-linux-x64-portable.tar.gz" -C "$portable_dir" .
            rm -rf "$portable_dir"
            (cd dist && sha256sum "LowNotes-${VERSION}-linux-x64-portable.tar.gz" > "LowNotes-${VERSION}-linux-x64-portable.tar.gz.sha256")
          fi

      - name: Guardar artefatos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lownotes-linux
          path: dist/*
          if-no-files-found: error

  # The Arch package wraps the binary from the Linux build with makepkg in an
  # Arch container. It stays on a GitHub-hosted runner because the self-hosted
  # one runs without Docker.
  linux-arch:
    name: Linux Arch package
    needs: [verify, linux]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Baixar o executável Linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lownotes-linux
          path: linux-assets

      - name: Criar pacote nativo Arch Linux (.pkg.tar.zst)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          arch_build="dist/arch-build"
          mkdir -p "$arch_build"
          tar -xzf "linux-assets/LowNotes-${VERSION}-linux-x64-portable.tar.gz" -C "$arch_build" ./LowNotes
          mv "$arch_build/LowNotes" "$arch_build/lownotes"
          cp "src-tauri/icons/128x128.png" "$arch_build/lownotes.png"
          cp "packaging/arch/lownotes.desktop" "$arch_build/lownotes.desktop"
          sed -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_BIN__/$(sha256sum "$arch_build/lownotes" | cut -d' ' -f1)/" \
            -e "s/__SHA256_DESKTOP__/$(sha256sum "$arch_build/lownotes.desktop" | cut -d' ' -f1)/" \
            -e "s/__SHA256_ICON__/$(sha256sum "$arch_build/lownotes.png" | cut -d' ' -f1)/" \
            packaging/arch/PKGBUILD.ci > "$arch_build/PKGBUILD"
          if grep -q "SKIP\|__SHA256" "$arch_build/PKGBUILD"; then
            echo "PKGBUILD checksums were not rendered." >&2
            exit 1
          fi
          docker run --rm -v "$PWD/$arch_build":/workspace -w /workspace archlinux:base-devel bash -c "
            useradd -m builder && \
            chown -R builder:builder /workspace && \
            su builder -c 'makepkg -f --nodeps'
          "
          arch_pkg=$(find "$arch_build" -name "*.pkg.tar.zst" | head -n 1)
          dest_arch="LowNotes-${VERSION}-linux-x86_64.pkg.tar.zst"
          cp "$arch_pkg" "dist/$dest_arch"
          (cd dist && sha256sum "$dest_arch" > "$dest_arch.sha256")
          sudo rm -rf "$arch_build"

      - name: Guardar artefatos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lownotes-linux-arch
          path: dist/*
          if-no-files-found: error
  # `tauri build --target universal-apple-darwin` compiles both architectures
  # one after the other, and each spends most of its time in single-threaded
  # LTO. Compiling them in parallel jobs and merging them with lipo halves the
  # slowest part of the release.
  macos-binary:
    name: macOS ${{ matrix.target }}
    needs: [verify]
    runs-on: macos-14
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile

      - name: Compilar aplicativo com Tauri (${{ matrix.target }})
        run: bun run tauri build --target ${{ matrix.target }} --no-bundle

      # Not prefixed with lownotes-: the publish job only downloads release files.
      - name: Guardar executável
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-binary-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/lownotes
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS universal (Apple Silicon + Intel)
    needs: [verify, macos-binary]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The bundler reads the target directory from cargo metadata.
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile

      - name: Baixar executáveis
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: macos-binary-*
          path: macos-binaries

      - name: Unir executáveis (lipo)
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "src-tauri/target/$target/release"
            cp "macos-binaries/macos-binary-$target/lownotes" "src-tauri/target/$target/release/lownotes"
          done
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create -output src-tauri/target/universal-apple-darwin/release/lownotes \
            src-tauri/target/aarch64-apple-darwin/release/lownotes \
            src-tauri/target/x86_64-apple-darwin/release/lownotes
          chmod +x src-tauri/target/universal-apple-darwin/release/lownotes
          lipo -info src-tauri/target/universal-apple-darwin/release/lownotes

      - name: Empacotar aplicativo com Tauri (universal)
        run: bun run tauri bundle --target universal-apple-darwin

      - name: Empacotar DMG universal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1 || true)
          if [[ -n "$dmg" && -f "$dmg" ]]; then
            dest="LowNotes-${VERSION}-macos-universal.dmg"
            cp "$dmg" "dist/$dest"
            (cd dist && shasum -a 256 "$dest" > "$dest.sha256")
          else
            echo "Nenhum DMG universal encontrado." >&2
            exit 1
          fi

          # Coletar artefato de updater do macOS (.app.tar.gz + sig)
          tarball=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" ! -name "*.sig" | head -n 1 || true)
          if [[ -n "$tarball" && -f "$tarball" ]]; then
            dest_t="LowNotes-${VERSION}-macos-universal.app.tar.gz"
            cp "$tarball" "dist/$dest_t"
            if [[ -f "$tarball.sig" ]]; then
              cp "$tarball.sig" "dist/$dest_t.sig"
            fi
          fi

      - name: Guardar artefatos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lownotes-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publicar no GitHub Releases
    needs: [verify, checks, windows, linux, linux-arch, macos]
    # A manual run with dry_run builds every installer and stops here.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Build provenance attestations (Sigstore) for every published file.
      id-token: write
      attestations: write
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Baixar todos os artefatos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: lownotes-*
          path: release-assets
          merge-multiple: true

      - name: Listar arquivos gerados
        shell: bash
        run: ls -la release-assets

      - name: Criar rascunho, manifesto e PKGBUILD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Create the release as a draft first so its generated notes exist
          # before latest.json is built from them; publish only at the end.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --draft \
              --title "LowNotes $VERSION"
          fi
          python3 .github/scripts/update_manifest.py
          python3 .github/scripts/render_pkgbuild.py "$VERSION" release-assets

      - name: Gerar SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release-assets/LowNotes-${{ needs.verify.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Gerar SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Atestar a proveniência dos arquivos
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/LowNotes-*
            release-assets/latest.json
            release-assets/PKGBUILD
            release-assets/SHA256SUMS

      - name: Publicar a Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -maxdepth 1 -type f)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Nenhum arquivo encontrado em release-assets." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
