name: Release multiplataforma

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para compilar (ex: v0.1.1)"
        required: true
        type: string
      source_ref:
        description: "Ref do código para compilar (opcional; usa a tag por padrão)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Conferir versão
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Conferir versões do aplicativo
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Não foi possível ler a versão do src-tauri/Cargo.toml." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "A tag $RELEASE_TAG não corresponde à versão $version do Cargo.toml." >&2
            exit 1
          fi
          frontend_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          tauri_version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          if [[ "$frontend_version" != "$version" || "$tauri_version" != "$version" ]]; then
            echo "As versões de package.json, tauri.conf.json e Cargo.toml devem coincidir." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile

      - name: Verificar frontend e Markdown
        run: |
          bun run check
          bun run check:e2e
          bun test
          python3 .github/scripts/test_update_manifest.py

      - name: Verificar interface antes de publicar
        run: |
          bun run build
          bunx playwright install --with-deps chromium
          bun run test:e2e

  windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile

      - name: Testar regressões Rust
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

      - name: Compilar aplicativo com Tauri
        run: bun run tauri build

      - name: Empacotar binários e instaladores
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          
          # Coletar instalador NSIS
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $destName = "LowNotes-$env:VERSION-windows-x64-setup.exe"
            Copy-Item $nsis.FullName "dist/$destName"
            $hash = (Get-FileHash "dist/$destName" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $destName" | Set-Content "dist/$destName.sha256" -Encoding ascii -NoNewline
          }

          # Coletar assinatura do updater (NSIS)
          $sig = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "dist/LowNotes-$env:VERSION-windows-x64-setup.exe.sig"
          }

          # Coletar instalador MSI
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $destMsi = "LowNotes-$env:VERSION-windows-x64.msi"
            Copy-Item $msi.FullName "dist/$destMsi"
            $hashMsi = (Get-FileHash "dist/$destMsi" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hashMsi  $destMsi" | Set-Content "dist/$destMsi.sha256" -Encoding ascii -NoNewline
          }

          # Criar pacote portátil (.zip) com o executável puro
          $rawExe = "src-tauri/target/release/lownotes.exe"
          if (Test-Path $rawExe) {
            $portableDir = "dist/LowNotes-$env:VERSION-windows-x64-portable"
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $rawExe "$portableDir/LowNotes.exe"
            Copy-Item "README.md" $portableDir
            Copy-Item "LICENSE" $portableDir
            $portableZip = "dist/LowNotes-$env:VERSION-windows-x64-portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            $zipHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
            "$zipHash  LowNotes-$env:VERSION-windows-x64-portable.zip" | Set-Content "$portableZip.sha256" -Encoding ascii -NoNewline
          }

      - name: Guardar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: lownotes-windows
          path: dist/*.*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: verify
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Instalar bibliotecas de sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile

      - name: Testar regressões Rust
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

      - name: Compilar aplicativo com Tauri
        run: bun run tauri build

      - name: Empacotar binários e pacotes Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # Coletar .deb
          deb_file=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1 || true)
          if [[ -n "$deb_file" && -f "$deb_file" ]]; then
            dest_deb="LowNotes-${VERSION}-linux-x64.deb"
            cp "$deb_file" "dist/$dest_deb"
            (cd dist && sha256sum "$dest_deb" > "$dest_deb.sha256")
          fi

          # Coletar .rpm
          rpm_file=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" | head -n 1 || true)
          if [[ -n "$rpm_file" && -f "$rpm_file" ]]; then
            dest_rpm="LowNotes-${VERSION}-linux-x64.rpm"
            cp "$rpm_file" "dist/$dest_rpm"
            (cd dist && sha256sum "$dest_rpm" > "$dest_rpm.sha256")
          fi

          # Coletar .AppImage
          appimage=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1 || true)
          if [[ -n "$appimage" && -f "$appimage" ]]; then
            dest_app="LowNotes-${VERSION}-linux-x64.AppImage"
            cp "$appimage" "dist/$dest_app"
            (cd dist && sha256sum "$dest_app" > "$dest_app.sha256")
          fi

          # Coletar assinatura do updater (AppImage)
          sig=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage.sig" | head -n 1 || true)
          if [[ -n "$sig" && -f "$sig" ]]; then
            cp "$sig" "dist/LowNotes-${VERSION}-linux-x64.AppImage.sig"
          fi

          # Criar pacote portátil tar.gz com o executável
          if [[ -f "src-tauri/target/release/lownotes" ]]; then
            portable_dir="dist/LowNotes-${VERSION}-linux-x64-portable"
            mkdir -p "$portable_dir"
            cp "src-tauri/target/release/lownotes" "$portable_dir/LowNotes"
            chmod +x "$portable_dir/LowNotes"
            cp README.md LICENSE "$portable_dir/"
            tar -czf "dist/LowNotes-${VERSION}-linux-x64-portable.tar.gz" -C "$portable_dir" .
            rm -rf "$portable_dir"
            (cd dist && sha256sum "LowNotes-${VERSION}-linux-x64-portable.tar.gz" > "LowNotes-${VERSION}-linux-x64-portable.tar.gz.sha256")
          fi

          # Criar pacote nativo Arch Linux (.pkg.tar.zst)
          if [[ -f "src-tauri/target/release/lownotes" ]]; then
            arch_build="dist/arch-build"
            mkdir -p "$arch_build"
            cp "src-tauri/target/release/lownotes" "$arch_build/lownotes"
            cp "src-tauri/icons/128x128.png" "$arch_build/lownotes.png"
            cp "packaging/arch/lownotes.desktop" "$arch_build/lownotes.desktop"
            sed "s/__VERSION__/${VERSION}/g" packaging/arch/PKGBUILD.ci > "$arch_build/PKGBUILD"
            docker run --rm -v "$PWD/$arch_build":/workspace -w /workspace archlinux:base-devel bash -c "
              useradd -m builder && \
              chown -R builder:builder /workspace && \
              su builder -c 'makepkg -f --nodeps'
            "
            arch_pkg=$(find "$arch_build" -name "*.pkg.tar.zst" | head -n 1 || true)
            if [[ -n "$arch_pkg" && -f "$arch_pkg" ]]; then
              dest_arch="LowNotes-${VERSION}-linux-x86_64.pkg.tar.zst"
              cp "$arch_pkg" "dist/$dest_arch"
              (cd dist && sha256sum "$dest_arch" > "$dest_arch.sha256")
            fi
            sudo rm -rf "$arch_build"
          fi

      - name: Guardar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: lownotes-linux
          path: dist/*
          if-no-files-found: error
  macos:
    name: macOS universal (Apple Silicon + Intel)
    needs: verify
    runs-on: macos-14
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile

      - name: Testar regressões Rust
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

      - name: Compilar aplicativo com Tauri (universal)
        run: bun run tauri build --target universal-apple-darwin

      - name: Empacotar DMG universal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1 || true)
          if [[ -n "$dmg" && -f "$dmg" ]]; then
            dest="LowNotes-${VERSION}-macos-universal.dmg"
            cp "$dmg" "dist/$dest"
            (cd dist && shasum -a 256 "$dest" > "$dest.sha256")
          else
            echo "Nenhum DMG universal encontrado." >&2
            exit 1
          fi

          # Coletar artefato de updater do macOS (.app.tar.gz + sig)
          tarball=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" ! -name "*.sig" | head -n 1 || true)
          if [[ -n "$tarball" && -f "$tarball" ]]; then
            dest_t="LowNotes-${VERSION}-macos-universal.app.tar.gz"
            cp "$tarball" "dist/$dest_t"
            if [[ -f "$tarball.sig" ]]; then
              cp "$tarball.sig" "dist/$dest_t.sig"
            fi
          fi

      - name: Guardar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: lownotes-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publicar no GitHub Releases
    needs: [verify, windows, linux, macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}

      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Listar arquivos gerados
        shell: bash
        run: ls -la release-assets

      - name: Criar ou atualizar a Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update_manifest.py
          mapfile -t files < <(find release-assets -maxdepth 1 -type f)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Nenhum arquivo encontrado em release-assets." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "LowNotes $VERSION"
          fi

          # Garante que a release esteja publicada (tags recriadas podem deixar draft)
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false || true
